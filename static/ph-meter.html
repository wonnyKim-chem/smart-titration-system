<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f1ec" />
    <title>pH 계측기 OCR | Smart Titration</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script src="https://docs.opencv.org/4.x/opencv.js" async></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">pH</div>
        <div>
          <p class="eyebrow">Camera B</p>
          <h1>pH 계측기 LCD 인식</h1>
        </div>
      </div>
      <span id="networkStatus" class="status">오프라인 저장</span>
    </header>

    <main class="workspace camera-layout">
      <section class="camera-stage" aria-label="pH 계측기 카메라 영상">
        <video id="camera" playsinline muted></video>
        <canvas id="processedFrame"></canvas>
        <div class="camera-overlay">
          <output id="livePh" class="live-value">pH --.--</output>
        </div>
      </section>

      <aside class="control-panel">
        <section class="control-section">
          <h2>LCD 인식</h2>
          <div class="control-grid">
            <button id="startCamera" class="wide" type="button">
              <i data-lucide="scan-line"></i><span>카메라 시작</span>
            </button>
            <label>
              숫자 자릿수
              <select id="digitCount">
                <option value="3" selected>3자리 (7.00)</option>
                <option value="4">4자리 (12.34)</option>
              </select>
            </label>
            <label>
              기록 주기
              <select id="sampleInterval">
                <option value="250">0.25초</option>
                <option value="500" selected>0.5초</option>
                <option value="1000">1초</option>
              </select>
            </label>
            <label class="wide">
              이진화 임계값 <output id="thresholdLabel">110</output>
              <input id="threshold" type="range" min="20" max="235" value="110" />
            </label>
            <div class="segmented wide" aria-label="LCD 명암">
              <button id="darkDigits" class="active" type="button">어두운 숫자</button>
              <button id="lightDigits" type="button">밝은 숫자</button>
            </div>
          </div>
        </section>

        <section class="control-section">
          <h2>인식 영역 (%)</h2>
          <div class="control-grid">
            <label>
              X <output id="roiXLabel">20</output>
              <input id="roiX" type="range" min="0" max="75" value="20" />
            </label>
            <label>
              Y <output id="roiYLabel">25</output>
              <input id="roiY" type="range" min="0" max="75" value="25" />
            </label>
            <label>
              너비 <output id="roiWidthLabel">60</output>
              <input id="roiWidth" type="range" min="20" max="100" value="60" />
            </label>
            <label>
              높이 <output id="roiHeightLabel">45</output>
              <input id="roiHeight" type="range" min="15" max="100" value="45" />
            </label>
          </div>
        </section>

        <div class="metric-row">
          <div class="metric"><span>원시 판독</span><strong id="rawReading">--.--</strong></div>
          <div class="metric"><span>안정도</span><strong id="confidence">0%</strong></div>
          <div class="metric"><span>윤곽 수</span><strong id="contourCount">0</strong></div>
          <div class="metric"><span>OpenCV</span><strong id="visionStatus">로딩</strong></div>
        </div>

        <a class="button-link secondary" href="/">
          <i data-lucide="chart-no-axes-combined"></i><span>분석 대시보드</span>
        </a>
      </aside>
    </main>

    <script type="module" src="/static/ph-meter.js"></script>
  </body>
</html>
