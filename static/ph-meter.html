<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f1ec" />
    <title>pH 계측기 OCR | Smart Titration</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script src="https://docs.opencv.org/4.x/opencv.js" async></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">pH</div>
        <div>
          <p class="eyebrow">Camera B</p>
          <h1>pH 계측기 LCD 인식</h1>
        </div>
      </div>
      <span id="networkStatus" class="status">오프라인 저장</span>
    </header>

    <main class="workspace camera-layout">
      <section id="cameraStage" class="camera-stage touch-camera" aria-label="pH 계측기 카메라 영상">
        <video id="camera" playsinline muted></video>
        <canvas id="processedFrame"></canvas>
        <p id="cameraMessage" class="camera-message">카메라 시작을 눌러 영상을 연결하세요.</p>
        <div class="camera-overlay">
          <output id="livePh" class="live-value">pH --.--</output>
        </div>
      </section>

      <aside class="control-panel">
        <section class="control-section workflow-section">
          <p class="step-label">간편 설정</p>
          <h2>계측기 숫자를 비춰주세요</h2>
          <p class="section-copy">카메라를 시작한 뒤 화면에서 LCD 숫자 부분을 한 번 터치하면 인식 영역을 자동으로 찾습니다.</p>
          <div class="control-grid">
            <button id="startCamera" class="wide" type="button">
              <i data-lucide="scan-line"></i><span>카메라 시작</span>
            </button>
            <button id="resetDisplay" class="secondary wide" type="button" disabled>
              <i data-lucide="focus"></i><span>LCD 영역 다시 선택</span>
            </button>
          </div>
          <div id="selectionStatus" class="friendly-status">카메라 연결 전</div>
        </section>

        <details class="advanced-settings">
          <summary>인식이 잘 안 될 때</summary>
          <div class="advanced-body control-grid">
            <label>
              표시 자릿수
              <select id="digitCount">
                <option value="3" selected>3자리 (7.00)</option>
                <option value="4">4자리 (12.34)</option>
              </select>
            </label>
            <label>
              기록 주기
              <select id="sampleInterval">
                <option value="250">0.25초</option>
                <option value="500" selected>0.5초</option>
                <option value="1000">1초</option>
              </select>
            </label>
          </div>
        </details>

        <span id="visionStatus" class="hidden">로딩</span>

        <a class="button-link secondary" href="/">
          <i data-lucide="chart-no-axes-combined"></i><span>분석 대시보드</span>
        </a>
      </aside>
    </main>

    <script type="module" src="/static/ph-meter.js"></script>
  </body>
</html>
