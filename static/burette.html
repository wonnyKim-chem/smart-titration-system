<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f1ec" />
    <title>뷰렛 추적 | Smart Titration</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script src="https://docs.opencv.org/4.x/opencv.js" async></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div>
          <p class="eyebrow">Camera A</p>
          <h1>뷰렛 메니스커스 추적</h1>
        </div>
      </div>
      <span id="networkStatus" class="status">오프라인 저장</span>
    </header>

    <main class="workspace camera-layout">
      <section class="camera-stage" aria-label="뷰렛 카메라 영상">
        <video id="camera" playsinline muted></video>
        <canvas id="processedFrame"></canvas>
        <p id="cameraMessage" class="camera-message">카메라 시작을 눌러 영상을 연결하세요.</p>
        <div class="camera-overlay">
          <output id="liveVolume" class="live-value">--.-- mL</output>
        </div>
      </section>

      <aside class="control-panel">
        <section class="control-section">
          <h2>카메라</h2>
          <div class="control-grid">
            <button id="startCamera" class="wide" type="button">
              <i data-lucide="camera"></i><span>카메라 시작</span>
            </button>
            <label>
              처리 방식
              <select id="detectionMode">
                <option value="canny">Canny</option>
                <option value="threshold">이진화</option>
              </select>
            </label>
            <label>
              임계값 <output id="thresholdLabel">90</output>
              <input id="threshold" type="range" min="20" max="220" value="90" />
            </label>
            <label class="wide">
              기록 주기
              <select id="sampleInterval">
                <option value="250">0.25초</option>
                <option value="500" selected>0.5초</option>
                <option value="1000">1초</option>
              </select>
            </label>
          </div>
        </section>

        <section class="control-section">
          <h2>2점 보정</h2>
          <div class="control-grid">
            <button id="setZero" class="secondary" type="button" disabled>
              <i data-lucide="circle-dot"></i><span>0 mL 설정</span>
            </button>
            <label>
              기준 부피 (mL)
              <input id="referenceVolume" type="number" value="10.00" min="0.01" step="0.01" />
            </label>
            <button id="setReference" class="wide" type="button" disabled>
              <i data-lucide="ruler"></i><span>기준점 설정</span>
            </button>
          </div>
        </section>

        <div class="metric-row">
          <div class="metric"><span>Y 현재</span><strong id="currentY">-- px</strong></div>
          <div class="metric"><span>환산 비율</span><strong id="scaleValue">--</strong></div>
          <div class="metric"><span>기울기</span><strong id="orientationValue">--°</strong></div>
          <div class="metric"><span>OpenCV</span><strong id="visionStatus">로딩</strong></div>
        </div>

        <a class="button-link secondary" href="/">
          <i data-lucide="chart-no-axes-combined"></i><span>분석 대시보드</span>
        </a>
      </aside>
    </main>

    <script type="module" src="/static/burette.js"></script>
  </body>
</html>
